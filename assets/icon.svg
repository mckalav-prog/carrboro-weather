<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)"/>
  <!-- Sun Aura -->
  <circle cx="256" cy="240" r="110" fill="#fef3c7" opacity="0.6"/>
  <!-- Sun Core -->
  <circle cx="256" cy="240" r="85" fill="url(#sunGrad)"/>
  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="95" x2="256" y2="125"/>
    <line x1="256" y1="355" x2="256" y2="385"/>
    <line x1="111" y1="240" x2="141" y2="240"/>
    <line x1="371" y1="240" x2="401" y2="240"/>
    <line x1="153" y1="137" x2="175" y2="159"/>
    <line x1="337" y1="321" x2="359" y2="343"/>
    <line x1="153" y1="343" x2="175" y2="321"/>
    <line x1="337" y1="159" x2="359" y2="137"/>
  </g>
  <!-- Orbit ring accent -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="362" cy="134" r="12" fill="#3b82f6"/>
</svg>
